[pytest]
# ── Discovery ──────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ─────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    -q

# ── Markers ────────────────────────────────────────────────────────────────
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests that require a running server
    unit: pure unit tests with no I/O

# ── Asyncio ────────────────────────────────────────────────────────────────
asyncio_mode = auto
